name: Sync English words from Notion

on:
  workflow_dispatch:
  schedule:
    # Hourly sync: 09:00–23:00 Kyiv time (UTC+2/UTC+3 -> 06:00–21:00 UTC)
    - cron: '0 6-21 * * *'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync Notion to Neon DB directly (no Git commit / no Vercel rebuild)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$NOTION_TOKEN" ] || [ -z "$DATABASE_URL" ]; then
            echo "Direct Neon sync skipped (using Vercel API or auto-sync on /api/vocabulary)."
          else
            npm install --no-audit --no-fund
            npm run sync:notion || echo "::warning::Notion sync script finished with warnings."
          fi

      - name: Trigger live Notion sync on Vercel API (no redeploy)
        env:
          VERCEL_API_URL: ${{ secrets.VERCEL_API_URL }}
          SYNC_SECRET: ${{ secrets.SYNC_SECRET || secrets.CRON_SECRET || secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$VERCEL_API_URL" ]; then
            echo "VERCEL_API_URL not set; /api/vocabulary on Vercel auto-syncs hourly from Notion into Neon DB."
          else
            curl -sS -X POST "$VERCEL_API_URL/api/notion-sync" \
              -H "Content-Type: application/json" \
              -H "x-sync-secret: $SYNC_SECRET" \
              -d '{}' || echo "::warning::Vercel notion-sync webhook reported a non-critical network issue."
          fi
