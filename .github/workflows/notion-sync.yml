name: Sync English words from Notion

on:
  workflow_dispatch:
  schedule:
    # Every hour from 09:00 to 23:00 UTC (adjust if needed for local TZ)
    - cron: '0 9-23 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: f38dba17-bbd6-4f04-9875-030212db4d0a
        run: npm run sync:notion
      - name: Commit synced data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/notionWords.generated.js public/notion-sync-meta.json public/words.json || true
          git diff --cached --quiet || git commit -m "chore: hourly sync English words from Notion"
          git push
