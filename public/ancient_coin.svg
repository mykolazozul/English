<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" style="overflow:visible;">
  <defs>
    <!-- Coin Face Gradient: Ancient Gold / Bronze with weathered patina -->
    <radialGradient id="ancientGoldFace" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="65%" stop-color="#b45309"/>
      <stop offset="88%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>

    <!-- 3D Coin Rim Gradient (Thickness / Depth) -->
    <linearGradient id="ancientRimDepth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="40%" stop-color="#451a03"/>
      <stop offset="70%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#291004"/>
    </linearGradient>

    <!-- Bevel Inner Ring Gradient -->
    <linearGradient id="ancientInnerBevel" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#b45309" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Drop Shadow Filter for 3D Float -->
    <filter id="ancientCoinShadow" x="-30%" y="-20%" width="170%" height="160%">
      <feDropShadow dx="2.5" dy="6" stdDeviation="4.5" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <!-- Antique Patina Filter -->
    <filter id="patinaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#fef08a" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Group with 3D Isometric Tilt & Sideways Angle -->
  <g filter="url(#ancientCoinShadow)" transform="translate(50, 50) rotate(-12) scale(1, 0.88) translate(-50, -50)">
    
    <!-- 3D Coin Edge / Rim Depth (Offset downwards for coin thickness) -->
    <path d="M 12 50 C 12 73 30 88 56 88 C 76 88 88 77 88 55 L 88 62 C 88 84 76 95 56 95 C 30 95 12 80 12 57 Z" fill="url(#ancientRimDepth)"/>
    <!-- Edge Texture ridges -->
    <path d="M 22 75 L 22 82 M 34 83 L 34 90 M 48 87 L 48 94 M 64 86 L 64 93 M 76 80 L 76 87" stroke="#311303" stroke-width="2" stroke-linecap="round"/>

    <!-- Main Coin Face (Tilted Oval with Weathered Edge) -->
    <path d="M 12 50 C 12 28 30 14 55 14 C 77 14 88 28 88 50 C 88 72 77 86 55 86 C 30 86 12 72 12 50 Z" 
          fill="url(#ancientGoldFace)" stroke="#78350f" stroke-width="2.2"/>

    <!-- Inner Engraved Runic Rim -->
    <path d="M 20 50 C 20 33 34 22 55 22 C 73 22 80 33 80 50 C 80 67 73 78 55 78 C 34 78 20 67 20 50 Z" 
          fill="none" stroke="url(#ancientInnerBevel)" stroke-width="2" stroke-dasharray="6 3.5"/>

    <!-- Ancient Carved Runic Monogram (Stylized EF / Dragon Claw) -->
    <g transform="translate(54, 50)" stroke="#451a03" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Runic Sigil -->
      <path d="M -8 -15 L -8 15 M -8 -15 L 6 -6 L -8 2 M -8 -1 L 6 9" stroke="#3b1503" stroke-width="3.2"/>
      <path d="M -8 -15 L -8 15 M -8 -15 L 6 -6 L -8 2 M -8 -1 L 6 9" stroke="#fef08a" stroke-width="1.2" stroke-opacity="0.85"/>
      <!-- Rune Dots -->
      <circle cx="10" cy="-10" r="2.2" fill="#fde047" stroke="#451a03" stroke-width="1"/>
      <circle cx="-14" cy="0" r="1.8" fill="#fde047" stroke="#451a03" stroke-width="1"/>
      <circle cx="8" cy="12" r="2" fill="#fde047" stroke="#451a03" stroke-width="1"/>
    </g>

    <!-- CRACK / FISSURE: Sharp jagged crack running from top right edge into the coin -->
    <g>
      <!-- Deep Dark Fracture Crevice -->
      <path d="M 68 15 L 63 24 L 66 31 L 58 40 L 61 48 L 54 58 L 56 66 L 49 76" 
            fill="none" stroke="#1f0a01" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="bevel"/>
      <!-- Secondary fissure branch -->
      <path d="M 58 40 L 50 43 L 46 48" 
            fill="none" stroke="#2a0e02" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 61 48 L 68 53" 
            fill="none" stroke="#2a0e02" stroke-width="1.6" stroke-linecap="round"/>
      <!-- Highlighted Sunken Edge (Light catching one side of the crack) -->
      <path d="M 69.5 15.5 L 64.5 24.5 L 67.5 31.5 L 59.5 40.5 L 62.5 48.5 L 55.5 58.5 L 57.5 66.5 L 50.5 76.5" 
            fill="none" stroke="#fef08a" stroke-width="0.9" stroke-linecap="round" stroke-opacity="0.95"/>
      <!-- Small Chipped Edge at Crack Origin -->
      <polygon points="66,13 72,16 67,19 63,16" fill="#381303" stroke="#220b01" stroke-width="0.8"/>
    </g>

    <!-- Weathered scratches & ancient coin patina spots -->
    <g stroke="#3b1503" stroke-width="1" stroke-linecap="round" opacity="0.65">
      <path d="M 28 32 L 35 36"/>
      <path d="M 25 62 L 31 59"/>
      <path d="M 72 65 L 77 69"/>
      <circle cx="34" cy="48" r="1" fill="#2d1002"/>
      <circle cx="73" cy="38" r="1.2" fill="#2d1002"/>
      <circle cx="44" cy="26" r="0.9" fill="#2d1002"/>
    </g>

    <!-- Specular Light Sheen across Upper Crest -->
    <path d="M 24 38 C 28 26 42 18 56 18 C 65 18 73 22 77 28" 
          fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.45" filter="url(#patinaGlow)"/>
  </g>
</svg>
