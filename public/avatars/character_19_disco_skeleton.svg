<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Master Metallic UI Gradients -->
    <linearGradient id="frameBevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="25%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="steelTrimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cyanNeonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="goldPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="lightSweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(56,189,248,0)" />
      <stop offset="50%" stop-color="rgba(56,189,248,0.6)" />
      <stop offset="100%" stop-color="rgba(56,189,248,0)" />
    </linearGradient>

    <!-- Circular Clip Path for Master Round Avatar -->
    <clipPath id="avatarScreenClip">
      <circle cx="256" cy="256" r="212" />
    </clipPath>

    
      <linearGradient id="neonDisco" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ec4899" /><stop offset="50%" stop-color="#8b5cf6" /><stop offset="100%" stop-color="#06b6d4" />
      </linearGradient>
    <style>
      @keyframes discoBob { 0%, 100% { transform: translateY(0) rotate(0deg); } 25% { transform: translateY(-6px) rotate(-4deg); } 75% { transform: translateY(-6px) rotate(4deg); } }
      @keyframes ballSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .skel-groove { transform-origin: 256px 360px; animation: discoBob 0.8s ease-in-out infinite; }
      .disco-mirror { transform-origin: 380px 120px; animation: ballSpin 6s linear infinite; }
    </style>
  </defs>

  <style>
    /* Frame continuous subtle animations */
    @keyframes framePulse {
      0%, 100% { stroke-opacity: 0.6; filter: drop-shadow(0 0 6px rgba(56,189,248,0.35)); }
      50% { stroke-opacity: 1; filter: drop-shadow(0 0 16px rgba(56,189,248,0.85)); }
    }
    @keyframes sweepRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .frame-neon-glow {
      animation: framePulse 4s ease-in-out infinite;
    }
    .frame-sweep-line {
      transform-origin: 256px 256px;
      animation: sweepRotate 12s linear infinite;
    }
  </style>

  <!-- BACKGROUND & CHARACTER CONTENT (CLIPPED TO CIRCLE) -->
  <g clip-path="url(#avatarScreenClip)">
    
  <g id="character-bg"><rect x="0" y="0" width="512" height="512" fill="#09090b" />
         <circle cx="256" cy="256" r="175" fill="#18181b" /></g>
  <g id="character-body">
      <!-- Mini Disco Ball -->
      <g class="disco-mirror">
        <circle cx="380" cy="120" r="28" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
        <line x1="380" y1="40" x2="380" y2="92" stroke="#64748b" stroke-width="2" />
        <path d="M 360 120 L 400 120 M 380 100 L 380 140" stroke="#cbd5e1" stroke-width="2" />
      </g>
      <g class="skel-groove">
        <!-- Ribcage with Neon Jacket -->
        <path d="M 190 350 Q 256 310 322 350 L 300 430 L 212 430 Z" fill="url(#neonDisco)" />
        <rect x="246" y="340" width="20" height="70" fill="#fafafa" rx="4" />
        <line x1="220" y1="365" x2="292" y2="365" stroke="#fafafa" stroke-width="5" />
        <line x1="226" y1="385" x2="286" y2="385" stroke="#fafafa" stroke-width="5" />
        <!-- Skull -->
        <ellipse cx="256" cy="220" rx="55" ry="50" fill="#fafafa" stroke="#e4e4e7" stroke-width="3" />
        <rect x="236" y="250" width="40" height="24" rx="6" fill="#fafafa" />
        <!-- Big Round Sunglasses -->
        <circle cx="236" cy="216" r="18" fill="#ec4899" stroke="#db2777" stroke-width="3" />
        <circle cx="276" cy="216" r="18" fill="#06b6d4" stroke="#0891b2" stroke-width="3" />
        <line x1="254" y1="216" x2="258" y2="216" stroke="#000" stroke-width="3" />
        <!-- Teeth -->
        <line x1="242" y1="262" x2="270" y2="262" stroke="#000" stroke-width="2" />
        <line x1="248" y1="254" x2="248" y2="270" stroke="#000" stroke-width="2" />
        <line x1="256" y1="254" x2="256" y2="270" stroke="#000" stroke-width="2" />
        <line x1="264" y1="254" x2="264" y2="270" stroke="#000" stroke-width="2" />
      </g>
    </g>
  
  </g>

  <!-- ================= MASTER FUTURISTIC METALLIC ROUND FRAME ================= -->
  <g id="frame">
    <!-- Outer Shadow Ring -->
    <circle cx="256" cy="256" r="244" fill="none" stroke="#020617" stroke-width="12" opacity="0.9" />

    <!-- Main Outer Beveled Steel Shell (Circular) -->
    <circle cx="256" cy="256" r="232" fill="none" stroke="url(#frameBevelGrad)" stroke-width="26" />
    
    <!-- Outer Highlight Rim -->
    <circle cx="256" cy="256" r="219" fill="none" stroke="url(#steelTrimGrad)" stroke-width="4" opacity="0.85" />

    <!-- Neon Cyan Inner Cyber Border -->
    <circle cx="256" cy="256" r="212" fill="none" stroke="url(#cyanNeonGrad)" stroke-width="5" class="frame-neon-glow" />

    <!-- 4 Symmetrical Gold Armor Clamps (Top, Right, Bottom, Left) -->
    <!-- Top Clamp -->
    <g transform="translate(256, 24)">
      <path d="M -18 0 L 18 0 L 12 24 L -12 24 Z" fill="url(#goldPlateGrad)" />
      <circle cx="0" cy="12" r="3.5" fill="#fef08a" stroke="#78350f" stroke-width="1.2" />
    </g>
    <!-- Right Clamp -->
    <g transform="translate(488, 256) rotate(90)">
      <path d="M -18 0 L 18 0 L 12 24 L -12 24 Z" fill="url(#goldPlateGrad)" />
      <circle cx="0" cy="12" r="3.5" fill="#fef08a" stroke="#78350f" stroke-width="1.2" />
    </g>
    <!-- Bottom Clamp -->
    <g transform="translate(256, 488) rotate(180)">
      <path d="M -18 0 L 18 0 L 12 24 L -12 24 Z" fill="url(#goldPlateGrad)" />
      <circle cx="0" cy="12" r="3.5" fill="#fef08a" stroke="#78350f" stroke-width="1.2" />
    </g>
    <!-- Left Clamp -->
    <g transform="translate(24, 256) rotate(270)">
      <path d="M -18 0 L 18 0 L 12 24 L -12 24 Z" fill="url(#goldPlateGrad)" />
      <circle cx="0" cy="12" r="3.5" fill="#fef08a" stroke="#78350f" stroke-width="1.2" />
    </g>

    <!-- Diagonal Rivets -->
    <circle cx="95" cy="95" r="4" fill="#94a3b8" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="417" cy="95" r="4" fill="#94a3b8" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="95" cy="417" r="4" fill="#94a3b8" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="417" cy="417" r="4" fill="#94a3b8" stroke="#0f172a" stroke-width="1.5" />

    <!-- Rotating Shimmer Light Sweep on Circular Bezel -->
    <g class="frame-sweep-line">
      <path d="M 256 12 A 244 244 0 0 1 400 60" fill="none" stroke="url(#lightSweepGrad)" stroke-width="6" stroke-linecap="round" />
    </g>
  </g>
</svg>